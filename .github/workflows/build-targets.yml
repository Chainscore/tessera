name: Build & Release Tessera Targets

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release-eligibility:
    name: Check Release Eligibility
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag commit is on main
        id: check
        run: |
          git fetch origin main --depth=1
          TAG_COMMIT="${GITHUB_SHA}"
          if git merge-base --is-ancestor "${TAG_COMMIT}" "origin/main"; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            echo "Tag commit is reachable from origin/main"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit is not reachable from origin/main"
          fi

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout-minutes || 60 }}
    env:
      JAM_LOG_LEVEL: "critical"
      PVM_MODE: "interpreter"
      LDFLAGS: "-O3"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-14
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            timeout-minutes: 15
          - os: darwin
            arch: x64
            runner: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}


      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          
          echo "Disk after cleanup:"
          df -h

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest" # or pin to a version like "0.4.26"

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            librocksdb-dev \
            git \
            curl \
            pkg-config \
            python3-dev \
            python3-pip

      - name: Install system dependencies (macOS)
        if: matrix.os == 'darwin'
        run: |
          brew install rocksdb gmp mpfr libmpc
          # Ensure Python development headers are available
          # This is usually included with brew python but let's be explicit
          echo "Python executable: $(which python3)"
          python3 -c "import sysconfig; print('Python lib dir:', sysconfig.get_path('stdlib'))"

      - name: Setup project
        run: |
          uv sync --extra build
          uv run pre-commit install

      - name: Build binary
        run: |
          chmod +x build-binary.sh setup-rocksdb.sh
          ./build-binary.sh

      - name: Fetch JAM test vectors
        run: |
          git clone --depth 1 https://github.com/w3f/jamtestvectors jamtestvectors

      - name: Cleanup caches before tests
        run: |
          # Remove caches to free disk space
          pip3 cache purge || true
          rm -rf ~/.cache/pip ~/.cache/* || true
          rm -rf ~/.uv || true
          rm -rf $HOME/.local/share/uv || true

          # Show disk usage
          df -h
          echo "Top large files:"
          sudo du -ah /home/runner 2>/dev/null | sort -rh | head -n 40 || true

      - name: Import test (JAM vectors) for Storage
        run: |
          VEC_DIR="${{ github.workspace }}/jamtestvectors/traces/storage"
          echo "Using vectors at: $VEC_DIR"
          if [ ! -d "$VEC_DIR" ]; then
            echo "ERROR: Missing test vectors path: $VEC_DIR" >&2
            echo "Workspace: ${{ github.workspace }}"
            echo "Listing jamtestvectors root (if present):" && ls -la "${{ github.workspace }}/jamtestvectors" || true
            echo "Listing jamtestvectors/traces (if present):" && ls -la "${{ github.workspace }}/jamtestvectors/traces" || true
            exit 1
          fi
          ./dist/tessera-node --import "$VEC_DIR"

      - name: Import test (JAM vectors) for Safrole
        run: |
          VEC_DIR="${{ github.workspace }}/jamtestvectors/traces/safrole"
          echo "Using vectors at: $VEC_DIR"
          if [ ! -d "$VEC_DIR" ]; then
            echo "❌ Missing test vectors path: $VEC_DIR" >&2
            echo "Workspace: ${{ github.workspace }}"
            echo "Listing jamtestvectors root (if present):" && ls -la "${{ github.workspace }}/jamtestvectors" || true
            echo "Listing jamtestvectors/traces (if present):" && ls -la "${{ github.workspace }}/jamtestvectors/traces" || true
            exit 1
          fi
          ./dist/tessera-node --import "$VEC_DIR"

      - name: Show results
        run: |
          echo "Binary size: $(du -sh dist/tessera-node | cut -f1)"
          ls -la dist/

      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Extract version from tag (remove 'v' prefix)
            VERSION="${{ github.ref_name }}"
            VERSION=${VERSION#v}  # Remove 'v' prefix if present
          elif [[ -f .version ]]; then
            # Fallback to .version file for manual dispatch
            VERSION=$(cat .version)
          else
            # Default version for manual dispatch without .version file
            VERSION="dev-$(date +'%Y-%m-%d-%H-%M-%S')"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tessera-v${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/tessera-node-*.tar.gz
          retention-days: 30

  release:
    name: Create Public Release
    needs: [release-eligibility, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-eligibility.outputs.on_main == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Extract version from tag (remove 'v' prefix)
            VERSION="${{ github.ref_name }}"
            VERSION=${VERSION#v}  # Remove 'v' prefix if present
          elif [[ -f .version ]]; then
            # Fallback to .version file for manual dispatch
            VERSION=$(cat .version)
          else
            # Default version for manual dispatch without .version file
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tessera-v${{ steps.version.outputs.version }}-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: |
          echo "Release assets:"
          ls -la release-assets/
          echo ""
          echo "Asset sizes:"
          du -sh release-assets/*

      - name: Create Release in Public Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Chainscore/tessera-releases # Public releases repo
          tag_name: v${{ steps.version.outputs.version }}
          name: "Tessera Node v${{ steps.version.outputs.version }}"
          body: |
            ## Tessera Binary Release v${{ steps.version.outputs.version }}

            Docker image:
            `ghcr.io/chainscore/tessera:v${{ steps.version.outputs.version }}`

            ### Downloads

            Choose the appropriate binary for your platform:

            - **Linux x86_64**: `tessera-node-Linux-x64.tar.gz`
            - **macOS Apple Silicon (M-Series)**: `tessera-node-Darwin-arm64.tar.gz`  
            - **macOS Intel**: `tessera-node-Darwin-x64.tar.gz`

            ### Quick Start

            # Run node
            ```bash
            ./tessera-node --help
            ```
            ```bash
            ./tessera-node --env <environment>
            ```

            # Run fuzzer target
            ```bash
            ./tessera-node --fuzzer --socket /tmp/jam_conformance.sock
            ```

            ### Docker

            Pull the release image:
            ```bash
            docker pull ghcr.io/chainscore/tessera:v${{ steps.version.outputs.version }}
            ```

            Run in conformance target mode:
            ```bash
            docker run --rm \
              -e JAM_FUZZ=1 \
              -e JAM_FUZZ_SPEC=tiny \
              -e JAM_FUZZ_DATA_PATH=/data \
              -e JAM_FUZZ_SOCK_PATH=/sock/jam_target.sock \
              -e JAM_FUZZ_LOG_LEVEL=info \
              -v /tmp/tessera-data:/data \
              -v /tmp/tessera-sock:/sock \
              ghcr.io/chainscore/tessera:v${{ steps.version.outputs.version }}
            ```

            ### Build Info

            - **Python**: 3.12
            - **PyInstaller**: Latest
            - **Version**: v${{ steps.version.outputs.version }}

            ---

            > **Note**: This is an automated release from the private Tessera repository.
            > For support or issues, please contact prasad@chainscore.finance
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  docker:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch jam-conformance protocol fixtures
        run: |
          git clone --depth 1 https://github.com/davxy/jam-conformance /tmp/jam-conformance

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fuzz
          load: true
          push: false
          tags: chainscore/tessera:ci

      - name: Smoke test Docker image
        run: |
          chmod +x scripts/test-docker-fuzz-image.sh
          JAM_CONFORMANCE_EXAMPLES_ROOT=/tmp/jam-conformance/fuzz-proto/examples/0.7.2 \
          ./scripts/test-docker-fuzz-image.sh chainscore/tessera:ci tiny tessera-fuzz-ci 50

  docker-release:
    name: Build And Push Docker Image
    needs: [release-eligibility, build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-eligibility.outputs.on_main == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch jam-conformance protocol fixtures
        run: |
          git clone --depth 1 https://github.com/davxy/jam-conformance /tmp/jam-conformance

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fuzz
          load: true
          push: false
          tags: |
            ghcr.io/chainscore/tessera:${{ steps.version.outputs.version }}
            ghcr.io/chainscore/tessera:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Smoke test release Docker image
        run: |
          chmod +x scripts/test-docker-fuzz-image.sh
          JAM_CONFORMANCE_EXAMPLES_ROOT=/tmp/jam-conformance/fuzz-proto/examples/0.7.2 \
          ./scripts/test-docker-fuzz-image.sh ghcr.io/chainscore/tessera:${{ steps.version.outputs.version }} tiny tessera-fuzz-release-test 50

      - name: Push tested Docker image
        run: |
          docker push ghcr.io/chainscore/tessera:${{ steps.version.outputs.version }}
          docker push ghcr.io/chainscore/tessera:latest
