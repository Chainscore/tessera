name: Deploy to Azure Container Instance

on:
  push:
    branches: [ main, develop, fix/deployment ]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Run in debug mode'
        type: boolean
        default: true

env:
  RESOURCE_GROUP: tessera
  IMAGE_NAME: tessera.azurecr.io/tessera/jam-node
  ACR_NAME: tessera
  CPU: "2"
  MEMORY: "4"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Set deployment specific variables
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/develop' ]]; then
            echo "CONTAINER_NAME=tessera-node-develop" >> $GITHUB_ENV
            echo "IMAGE_TAG=develop" >> $GITHUB_ENV
            echo "DNS_LABEL=tessera-jam-node-develop" >> $GITHUB_ENV
          else
            echo "CONTAINER_NAME=tessera-node" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "DNS_LABEL=tessera-jam-node" >> $GITHUB_ENV
          fi

      - name: Checkout code
        uses: actions/checkout@v3

      - name: 📥 Checkout code with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          submodules: 'recursive'

      - name: � Verify submodules are present
        run: |
          echo "🔍 Verifying critical submodules are present..."
          REQUIRED_SUBMODULES=(
            "deps/tsrkit-pvm"
            "deps/py-ark-vrf" 
            "deps/rockstore"
            "deps/tsrkit-asm"
            "deps/tsrkit-types"
          )
          
          MISSING_SUBMODULES=()
          for submod in "${REQUIRED_SUBMODULES[@]}"; do
            if [ ! -d "$submod" ] || [ -z "$(ls -A $submod)" ]; then
              MISSING_SUBMODULES+=("$submod")
            else
              echo "✅ $submod: present"
            fi
          done
          
          if [ ${#MISSING_SUBMODULES[@]} -ne 0 ]; then
            echo "❌ Missing required submodules:"
            printf '   %s\n' "${MISSING_SUBMODULES[@]}"
            echo ""
            echo "🔧 Attempting manual submodule update..."
            git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive --force
            
            # Verify again
            STILL_MISSING=()
            for submod in "${MISSING_SUBMODULES[@]}"; do
              if [ ! -d "$submod" ] || [ -z "$(ls -A $submod)" ]; then
                STILL_MISSING+=("$submod")
              else
                echo "✅ Recovered: $submod"
              fi
            done
            
            if [ ${#STILL_MISSING[@]} -ne 0 ]; then
              echo "❌ Critical error: Still missing after recovery:"
              printf '   %s\n' "${STILL_MISSING[@]}"
              echo ""
              echo "Debug info:"
              echo "Git submodule status:"
              git submodule status || true
              echo ""
              echo "Directory structure:"
              ls -la deps/ || true
              exit 1
            fi
          fi
          
          echo "🎉 All required submodules are present!"

      - name: Log in to Azure
        uses: azure/login@v2 
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64

      - name: Get ACR credentials
        id: get-acr-creds
        uses: azure/CLI@v2
        with:
          inlineScript: |
            ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query "username" -o tsv)
            ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
            echo "ACR_USERNAME=$ACR_USERNAME" >> $GITHUB_OUTPUT
            echo "ACR_PASSWORD=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: Update or Create Azure Container Instance
        uses: azure/CLI@v2
        with:
          inlineScript: |
            DEBUG_MODE=${{ github.event.inputs.debug_mode || 'true' }}
            
            # Check if container already exists
            if az container show --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_NAME }} >/dev/null 2>&1; then
              echo "Container exists, restarting to pull latest image..."
              
              # For existing containers, just restart to pull the latest image
              MAX_RETRIES=3
              RETRY_COUNT=0
              RESTARTED=false
              
              while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$RESTARTED" != "true" ]; do
                echo "Attempt $(($RETRY_COUNT+1)) to restart container instance..."
                
                if az container restart --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_NAME }}; then
                  RESTARTED=true
                  echo "Container restarted successfully! Latest image will be pulled."
                else
                  echo "Failed to restart container. Retrying in 30 seconds..."
                  RETRY_COUNT=$(($RETRY_COUNT+1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    sleep 30
                  else
                    echo "Failed to restart container after $MAX_RETRIES attempts."
                    exit 1
                  fi
                fi
              done
            else
              echo "Container does not exist, creating new container instance..."
              
              # For new deployments, create the container from scratch
              MAX_RETRIES=3
              RETRY_COUNT=0
              CREATED=false
              
              while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$CREATED" != "true" ]; do
                echo "Attempt $(($RETRY_COUNT+1)) to create container instance..."
                
                if az container create \
                  --resource-group ${{ env.RESOURCE_GROUP }} \
                  --name ${{ env.CONTAINER_NAME }} \
                  --image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
                  --registry-login-server "${{ env.ACR_NAME }}.azurecr.io" \
                  --registry-username "${{ steps.get-acr-creds.outputs.ACR_USERNAME }}" \
                  --registry-password "${{ steps.get-acr-creds.outputs.ACR_PASSWORD }}" \
                  --cpu ${{ env.CPU }} \
                  --memory ${{ env.MEMORY }} \
                  --environment-variables JAM_DEBUG=$DEBUG_MODE \
                  --ports 8000 \
                  --ip-address Public \
                  --dns-name-label "${{ env.DNS_LABEL }}" \
                  --restart-policy Never \
                  --os-type Linux; then
                  
                  CREATED=true
                  echo "Container created successfully!"
                else
                  echo "Failed to create container. Retrying in 30 seconds..."
                  RETRY_COUNT=$(($RETRY_COUNT+1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    sleep 30
                  else
                    echo "Failed to create container after $MAX_RETRIES attempts."
                    exit 1
                  fi
                fi
              done
            fi

      - name: Verify deployment health
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Checking if container is running properly..."
            # Wait for service to start up
            sleep 30
            
            # Get the FQDN of the container
            FQDN=$(az container show --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_NAME }} --query "ipAddress.fqdn" -o tsv)
            
            # Check if service is responsive on port 8000
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${FQDN}:8000/docs || echo "Failed")
            
            if [[ "$HTTP_STATUS" == "200" ]]; then
              echo "✅ Service is healthy on port 8000"
              echo "NOTE: To access via HTTPS, you'll need to set up Azure Front Door or Application Gateway"
            else
              echo "❌ Service is not responding correctly. Status: $HTTP_STATUS"
              echo "You may need to check logs for more details"
              exit 1
            fi

      - name: Debug information
        if: ${{ github.event.inputs.debug_mode != 'false' }}
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "Container running in DEBUG mode"
            echo "To access container shell:"
            echo "az container exec --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_NAME }} --exec-command /bin/bash"
            echo "To view logs:"
            echo "az container logs --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_NAME }}"
            echo "To attach to container:"
            echo "az container attach --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_NAME }}"
            
            # Wait for container to be fully up
            sleep 15
            
            # Try to access container shell
            az container exec --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_NAME }} --exec-command "/bin/bash -c 'ls -la /app/data || echo \"No data directory yet\"'" 