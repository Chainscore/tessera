
name: Publish Commit Hash

# Test comment for workflow trigger
on:
  push:

jobs:
  publish-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install web3 eth-account
      - name: Publish commit hash
        env:
          PRIVATE_KEY: ${{ secrets.POLYGON_PRIVATE_KEY }}
        run: |
          python -c "
          from web3 import Web3
          from eth_account import Account
          
          # Initialize Web3 with Polygon RPC
          w3 = Web3(Web3.HTTPProvider('https://polygon-rpc.com'))
          
          # Contract address and ABI
          contract_address = '0x0113E1920540Fa9547389d02E7e79f60B4D4f503'
          contract_abi = [{'inputs': [{'internalType': 'bytes32', 'name': 'commitHash', 'type': 'bytes32'}], 'name': 'anchor', 'outputs': [], 'stateMutability': 'nonpayable', 'type': 'function'}]
          
          # Get the contract instance
          contract = w3.eth.contract(address=contract_address, abi=contract_abi)
          
          # Get the commit hash
          commit_hash = '${{ github.sha }}'
          commit_hash_bytes = bytes.fromhex(commit_hash)
          
          # Pad the commit hash to 32 bytes if needed
          if len(commit_hash_bytes) < 32:
              commit_hash_bytes = commit_hash_bytes + b'\\x00' * (32 - len(commit_hash_bytes))
          # Create account from private key, ensuring it starts with 0x
          private_key = '${{ secrets.POLYGON_PRIVATE_KEY }}'
          if not private_key.startswith('0x'):
              private_key = '0x' + private_key
          account = Account.from_key(private_key)
          
          # Build transaction
          nonce = w3.eth.get_transaction_count(account.address)
          gas_price = w3.eth.gas_price
          
          transaction = contract.functions.anchor(commit_hash_bytes).build_transaction({
              'chainId': 137,  # Polygon mainnet
              'gas': 100000,
              'gasPrice': gas_price + 1000,
              'nonce': nonce,
          })
          
          # Sign and send transaction
          signed_txn = w3.eth.account.sign_transaction(transaction, '${{ secrets.POLYGON_PRIVATE_KEY }}')
          tx_hash = w3.eth.send_raw_transaction(signed_txn.raw_transaction)
          
          # Wait for transaction receipt
          receipt = w3.eth.wait_for_transaction_receipt(tx_hash)
          print(f'Transaction successful with hash: {receipt.transactionHash.hex()}')
          "