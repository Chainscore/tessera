name: 🚀 Binary Build

on:
  push:
    branches: [ main, binary ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-22.04
          - os: darwin
            arch: arm64
            runner: macos-14
          - os: darwin
            arch: x64
            runner: macos-13

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          submodules: false

      - name: 📦 Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init deps/py-ark-vrf deps/tsrkit-pvm deps/tsrkit-asm

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '1.8.2'
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: 🔧 Install system dependencies (Ubuntu)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: 🏗️ Install dependencies
        run: |
          poetry install --with dev
          
          # Verify PyInstaller is available
          if ! poetry run pyinstaller --version > /dev/null 2>&1; then
            echo "⚠️ PyInstaller not found, installing directly..."
            poetry run pip install pyinstaller>=6.14.2
          fi
          
          echo "✅ PyInstaller version: $(poetry run pyinstaller --version)"

      - name: 🔨 Build binary
        run: |
          chmod +x build-binary.sh
          ./build-binary.sh

      - name: 🧪 Test binary
        run: |
          ./dist/tessera-node --help

      - name: 📊 Show results
        run: |
          echo "📏 Binary size: $(du -sh dist/tessera-node | cut -f1)"
          ls -la dist/

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tessera-node-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/tessera-node-*.tar.gz
          retention-days: 30
