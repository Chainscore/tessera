name: 🚀 Binary Build

on:
  push:
    branches: [ main, binary ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: linux
            arch: x64
            runner: ubuntu-22.04
            
          # macOS builds  
          - os: darwin
            arch: arm64
            runner: macos-14  # M1 runners
            
          - os: darwin
            arch: x64
            runner: macos-13  # Intel runners

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '1.8.2'
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: 🔧 Install system dependencies (Ubuntu)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential upx-ucl

      - name: 🔧 Install system dependencies (macOS)
        if: matrix.os == 'darwin'
        run: |
          # Install UPX via Homebrew if not already installed
          brew install upx || true

      - name: 📚 Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
            .venv
          key: poetry-${{ matrix.runner }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ matrix.runner }}-

      - name: 🏗️ Install dependencies
        run: |
          poetry install --only=main

      - name: 🔨 Build binary
        env:
          UPX_COMPRESS: true
          COMPREHENSIVE_TEST: true
          GENERATE_CHECKSUMS: true
        run: |
          # Use build script
          chmod +x build-binary.sh
          ./build-binary.sh

      - name: 🧪 Smoke test binary
        run: |
          # Additional smoke tests
          ./dist/tessera-node --help
          
          # Test binary doesn't crash on startup
          timeout 10s ./dist/tessera-node --port 40000 || true

      - name: 📊 Binary analysis
        run: |
          echo "📏 Binary size: $(du -sh dist/tessera-node | cut -f1)"
          echo "📦 Package size: $(du -sh dist/*.tar.gz | cut -f1)"
          echo "🔍 Binary info:"
          file dist/tessera-node
          
          # List package contents
          echo "📋 Package contents:"
          tar -tzf dist/*.tar.gz | head -10

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tessera-node-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/tessera-node*
            !dist/tessera-node  # Exclude raw binary, keep packages and checksums
          retention-days: 30

      - name: 📤 Upload binary for release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-tessera-node-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/tessera-node-*.tar.gz
            dist/tessera-node-*.sha256
          retention-days: 90

  # Create release if this is a tag push or manual release request
  release:
    name: 🚀 Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-tessera-node-*
          merge-multiple: true
          path: release-assets

      - name: 📋 List release assets
        run: |
          echo "🎯 Release assets:"
          ls -la release-assets/
          
          echo ""
          echo "📊 Asset sizes:"
          du -sh release-assets/*

      - name: 🏷️ Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="nightly-$(date +'%Y%m%d')-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 📝 Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 🚀 Tessera Node Binary Release ${{ steps.version.outputs.version }}
          
          ### 📦 Downloads
          
          Choose the appropriate binary for your platform:
          
          - **Linux x86_64**: `tessera-node-Linux-x64.tar.gz`
          - **macOS Apple Silicon**: `tessera-node-Darwin-arm64.tar.gz`  
          - **macOS Intel**: `tessera-node-Darwin-x64.tar.gz`
          
          ### ✅ Verification
          
          All binaries include SHA256 checksums for verification:
          
          ```bash
          # Verify download integrity
          shasum -a 256 -c tessera-node-*.tar.gz.sha256
          ```
          
          ### 🚀 Usage
          
          ```bash
          # Extract and run
          tar -xzf tessera-node-*.tar.gz
          ./tessera-node --help
          ./tessera-node --port 40000
          ```
          
          ### 📋 What's Included
          
          - `tessera-node`: Main executable binary
          - `genesis.json`: Genesis configuration
          - `dev-spec.json`: Development specification  
          - `envs/`: Environment configurations
          - `README.txt`: Usage instructions
          
          ### 🔍 Build Info
          
          - **Python**: 3.12+
          - **PyInstaller**: Latest
          - **UPX Compression**: Applied where supported
          - **Size**: ~37MB per binary
          - **Startup Time**: <2 seconds
          
          Built with GitHub Actions from commit: ${{ github.sha }}
          EOF
          
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Tessera Node ${{ steps.version.outputs.version }}"
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          files: release-assets/*
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build summary job
  summary:
    name: 📊 Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📥 Download build logs
        uses: actions/download-artifact@v4
        with:
          pattern: tessera-node-*
          merge-multiple: true
          path: artifacts

      - name: 📊 Generate build summary
        run: |
          echo "# 🚀 Tessera Node Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if ls artifacts/*.tar.gz 1> /dev/null 2>&1; then
            echo "| Platform | Size | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
            
            for file in artifacts/*.tar.gz; do
              if [[ -f "$file" ]]; then
                name=$(basename "$file" .tar.gz)
                platform=$(echo "$name" | sed 's/tessera-node-//')
                size=$(du -sh "$file" | cut -f1)
                echo "| $platform | $size | ✅ Success |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "❌ No build artifacts found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [📦 Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [🚀 Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "- [📖 Documentation](https://github.com/${{ github.repository }}#readme)" >> $GITHUB_STEP_SUMMARY
