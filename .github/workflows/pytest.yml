name: Python Tests

on:
  push:
    branches: [ main, dev, staging ]
  pull_request:
    branches: [ main, dev, staging ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'
        
    - name: Install Poetry
      run: pip install poetry

    - name: Debug - List files in root
      run: ls -lah

    - name: Clean Install dependencies via Poetry
      run: rm poetry.lock && poetry install --with dev --no-interaction --no-ansi

#    - name: Install dependencies via Poetry
#      run: poetry install --with dev --no-interaction --no-ansi
    
    - name: Install PyTest
      run: pip install pytest
    
    - name: Run tests
      run: |
        pytest tests/