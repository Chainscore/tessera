[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tessera"
version = "0.1.0"
description = "JAM blockchain client implementation in Python"
authors = ["Chainscore Labs <hello@chainscore.finance>"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "jam" }]

[tool.poetry.dependencies]
python = "^3.11"
cryptography = "45.0.2"
structlog = "^25.2.0"
aioquic = "^1.2.0"

tsrkit-types = "^0.1.3"
rockstore = "^0.1.2"
reed-solomon-leopard = "^0.2.1"
py-ark-vrf = "0.1.3"
python-dotenv = "^1.1.0"
asyncio = "^3.4.3"
pyarmor = "^9.1.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
pytest-cov = "^6.0.0"
flake8 = "4.0.1"
black = "23.12.1"
isort = "5.13.2"
pre-commit = "4.0.1"
sphinx = "8.1.3"
pyinstaller = { version = "^6.14.2", markers = "python_version < '3.14'" }
poethepoet = "^0.36.0"

[tool.poetry.scripts]
jam = "jam:run_jam"

[tool.poe.tasks]
build = "./scripts/build.sh"
