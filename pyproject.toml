[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tessera"
version = "0.1.0"
description = "JAM blockchain client implementation"
authors = ["Prasad Kumkar <prasad@chainscore.finance>"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "jam" }]

[tool.poetry.dependencies]
python = "^3.11"
asyncio = "^3.4.3"
cryptography = "^41.0.0"
aiohttp = "^3.8.1"
pydantic = "^2.0.0"
structlog = "^23.1.0"
py-ecc = "^6.0.0"
blake2b = "^0.1.3"
uvloop = "^0.17.0"
rocksdb = "^0.9.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
pytest-asyncio = "^0.21.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.4.1"
pylint = "^2.17.5"

[tool.poetry.scripts]
jam = "jam.__main__:main"
