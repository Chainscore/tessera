[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tessera"
version = "0.1.0"
description = "JAM blockchain client implementation in Python"
authors = ["Chainscore Labs <hello@chainscore.finance>"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "jam" }]

[tool.poetry.dependencies]
python = "^3.12"
sympy = "1.13.1"
cryptography = "45.0.2"
pycryptodome = "^3.21.0"
numpy = "2.2.3"
structlog = "^25.2.0"
aioquic = "^1.2.0"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
quart = "^0.20.0"
py-ecc = "^8.0.0"
tsrkit-types = "^0.1.8"
rockstore = "^0.1.2"
reed-solomon-leopard = "^0.2.1"
python-dotenv = "^1.1.0"
asyncio = "^3.4.3"
dot_ring = { path = "../dot-ring", develop = true }
# py-ark-vrf = "0.2.3"
py-ark-vrf = { path = "../py-ark-vrf", develop = true }


[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
flake8 = "4.0.1"
black = "23.12.1"
isort = "5.13.2"
pre-commit = "4.0.1"
sphinx = "8.1.3"

[tool.poetry.scripts]
jam = "jam:run_jam"

[tool.ruff]
line-length = 100
select = [
    "E",
    "F",
    "I",
    "B",
    "W",
    "UP",
] # Errors, pyflakes, isort, bugbear, warnings, upgrades
exclude = ["migrations", ".venv"]

[tool.black]
line-length = 100
target-version = ['py310']
