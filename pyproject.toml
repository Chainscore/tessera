[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tessera"
version = "0.1.0"
description = "JAM blockchain client implementation in Python"
authors = ["Chainscore Labs <hello@chainscore.finance>"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "jam" }]

[tool.poetry.dependencies]
python = "^3.11"
aiohappyeyeballs = "2.4.4"
aiohttp = "3.11.11"
aiosignal = "1.3.2"
annotated-types = "0.7.0"
astroid = "2.15.8"
sympy = "1.13.1"
cryptography = "44.0.1"
pycryptodome = "^3.21.0"
numpy = "2.2.3"
uvloop = "^0.21.0"
structlog = "^25.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
pytest-cov = "^6.0.0"
flake8 = "4.0.1"
black = "23.12.1"
isort = "5.13.2"
pre-commit = "4.0.1"
sphinx = "8.1.3"

[tool.poetry.scripts]
jam = "jam:run_jam"
