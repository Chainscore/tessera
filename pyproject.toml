[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tessera"
version = "0.1.0"
description = "JAM blockchain client implementation"
authors = ["Prasad Kumkar <prasad@chainscore.finance>"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "jam" }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
pytest-cov = "^6.0.0"

[tool.poetry.scripts]
jam = "jam.__main__:main"
